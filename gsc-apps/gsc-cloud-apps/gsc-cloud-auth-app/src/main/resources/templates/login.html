<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>统一登录页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div id="app" class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center mb-6">用户登录</h2>

    <!-- 错误提示 -->
    <div v-if="error" class="p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-md">
        {{ error }}
    </div>

    <!-- 登录表单 -->
    <form @submit.prevent="login">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <input
                    type="text"
                    id="username"
                    v-model="form.username"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <div class="mb-4">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input
                    type="password"
                    id="password"
                    v-model="form.password"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>
        <button
                type="submit"
                class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition duration-200"
        >
            登录
        </button>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const app = Vue.createApp({
        data() {
            return {
                form: {
                    username: '',
                    password: ''
                },
                error: ''
            };
        },
        methods: {
            async login() {
                try {
                    const response = await axios.post('/login', new URLSearchParams(this.form).toString(), {
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });

                    // 获取 redirect_url 参数
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect_url');

                    if (redirectUrl) {
                        // 如果是小程序环境，携带 token 跳转
                        window.location.href = `${redirectUrl}?token=${response.data.token}`;
                    } else {
                        window.location.href = '/home';
                    }
                } catch (err) {
                    this.error = '登录失败，请检查用户名和密码。';
                }
            }
        }
    });

    app.mount('#app');
    /*]]>*/
</script>

</body>
</html>
